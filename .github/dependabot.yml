version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependency-updates"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
