version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"              # 6 PM IST
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "gradle"
    directory: "/backend"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "backend"

  - package-ecosystem: "npm"
    directory: "/frontend"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "frontend"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    labels:
      - "ci"

  # Enable once the Dockerfile(s) exist in infra/
  # - package-ecosystem: "docker"
  #   directory: "/infra"
  #   patterns: ["*"]
  #   multi-ecosystem-group: "all-dependencies"
  #   labels:
  #     - "infra"
