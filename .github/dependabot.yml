version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"              # 6 PM IST
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
    groups:
      all-dependencies:
        patterns:
          - "*"
