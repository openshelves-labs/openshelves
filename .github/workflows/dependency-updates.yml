name: Dependency Updates

on:
  push:
    branches: [main]
    paths:
      - '**/build.gradle'
      - '**/build.gradle.kts'
      - '**/settings.gradle'
      - '**/settings.gradle.kts'
      - '**/gradle-wrapper.properties'
      - '**/.nvmrc'
      - '**/.node-version'
      - '**/package.json'
      - '**/Dockerfile*'
      - '**/*.dockerfile'
      - '**/compose*.yml'
      - '**/compose*.yaml'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - '.github/workflows/dependency-updates.yml'
      - '.github/scripts/dependency-updates.js'
  schedule:
    - cron: "30 11 * * 5"   # Fridays 17:00 IST (cron is UTC-only: 11:30 UTC)
  workflow_dispatch:

jobs:
  report:
    name: Report Available Updates
    # Reports on the default branch only; workflow_dispatch has no branch filter, so a run
    # started on another branch is skipped. Scheduled runs always use the default branch.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.nvmrc'

      - name: Check for dependency updates
        uses: actions/github-script@v9
        with:
          script: |
            const runScript = require('./.github/scripts/dependency-updates.js');
            await runScript({ github, context, core });
