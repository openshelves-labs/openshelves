name: Outdated Dependencies

on:
  push:
    branches: [main]
    paths:
      - '**/build.gradle'
      - '**/build.gradle.kts'
      - '**/settings.gradle'
      - '**/settings.gradle.kts'
      - '**/gradle-wrapper.properties'
      - '**/.nvmrc'
      - '**/.node-version'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/Dockerfile*'
      - '**/*.dockerfile'
      - '**/compose*.yml'
      - '**/compose*.yaml'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - '.github/workflows/outdated-dependencies.yml'
      - '.github/scripts/outdated-dependencies.js'
  schedule:
    - cron: "30 11 * * *"   # Daily 17:00 IST (cron is UTC-only: 11:30 UTC)
    # - cron: "30 11 * * 5"   # Fridays 17:00 IST (cron is UTC-only: 11:30 UTC)
  workflow_dispatch:

# Runs compare against the previous run's saved state, so queue them instead of overlapping.
concurrency:
  group: outdated-dependencies
  cancel-in-progress: false

jobs:
  report:
    name: Check & Report
    # Reports on the default branch only; workflow_dispatch has no branch filter, so a run
    # started on another branch is skipped. Scheduled runs always use the default branch.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.nvmrc'

      - name: Check dependencies & update issue
        uses: actions/github-script@v9
        with:
          script: |
            const runScript = require('./.github/scripts/outdated-dependencies.js');
            await runScript({ github, context, core });
