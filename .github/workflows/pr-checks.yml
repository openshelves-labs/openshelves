name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  verify-requirements:
    name: Verify PR Requirements
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check CLA checkbox
        uses: actions/github-script@v7
        with:
          script: |
            const check = require('./.github/scripts/cla-check.js');
            await check({ github, context, core });

      - name: Check PR Checklists checkbox
        if: always() # Run even if CLA fails so the user sees all missing requirements at once
        uses: actions/github-script@v7
        with:
          script: |
            const check = require('./.github/scripts/pr-checklist-check.js');
            await check({ github, context, core });
