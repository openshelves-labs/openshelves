plugins {
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'

    // Dependency Updater
    id 'com.github.ben-manes.versions' version '0.53.0'

    // IDEs
    id 'idea'
}

group = 'com.openshelves'
version = '0.0.1-alpha'

description = 'Modernizing the university library experience. OpenShelves turns complex academic catalogs into intuitive, open discovery platforms for the digital age.'


// Requires Java 25 from Azul Systems

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.AZUL
    }
}


// Dependency management and Repository configuration

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Spring Web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Spring JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // HTTP Client
    implementation 'com.squareup.okhttp3:okhttp'
    implementation 'com.jayway.jsonpath:json-path'

    // Resilience4j for fault tolerance
    implementation 'io.github.resilience4j:resilience4j-ratelimiter'
    implementation 'io.github.resilience4j:resilience4j-retry'

    // Apache Commons Libraries
    implementation 'org.apache.commons:commons-lang3'

    // Annotation processors
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.1'
        mavenBom 'org.springdoc:springdoc-openapi-bom:3.0.2'
        mavenBom 'com.squareup.okhttp3:okhttp-bom:5.3.2'
        mavenBom 'io.github.resilience4j:resilience4j-bom:2.4.0'
        mavenBom 'org.testcontainers:testcontainers-bom:2.0.4'
    }
}


// Java compilation and testing configuration

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-parameters',          // Preserves parameter names for reflection
        '-Xlint:unchecked',     // Enables unchecked operation warnings
        '-Xlint:deprecation'    // Enables deprecation warnings
    ]
}

test {
    useJUnitPlatform()      // Using JUnit Platform for testing
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.register('downloadDependencies') {
    group = 'build setup'
    description = 'Downloads all dependencies to the local Gradle cache.'

    doFirst {
        println 'Downloading dependencies for all configurations...'
        configurations.asMap.each { name, configuration ->
            if (configuration.canBeResolved) {
                try {
                    configuration.resolve()
                    println "Resolved configuration: $name"
                } catch (Exception e) {
                    println "Failed to resolve configuration: $name - ${e.message}"
                }
            }
        }
    }
}

tasks.named('dependencyUpdates').configure {
//    checkConstraints = true
//    checkBuildEnvironmentConstraints = true
    gradleReleaseChannel = 'current'

    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}

wrapper {
    gradleVersion = 'latest'
    distributionType = Wrapper.DistributionType.BIN
}
