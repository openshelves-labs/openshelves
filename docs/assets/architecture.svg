<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>OpenShelves system architecture</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5d45"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#717972"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b1c19" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ───────────── Canvas ───────────── -->
  <rect x="0.5" y="0.5" width="1279" height="719" rx="16" fill="#fbf9f4" stroke="#e4e2dd"/>

  <!-- ───────────── Title ───────────── -->
  <text x="48" y="62" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="28" font-weight="600" fill="#16452f">OpenShelves · System architecture</text>
  <text x="48" y="90" font-size="14" fill="#414943">How a request travels from the browser, through the API, to the database and external services.</text>

  <!-- ───────────── Column headers ───────────── -->
  <g font-size="11" font-weight="700" letter-spacing="1.6" fill="#717972">
    <text x="48" y="142">USERS</text>
    <text x="280" y="142">OPENSHELVES PLATFORM</text>
    <text x="990" y="142">EXTERNAL SERVICES</text>
  </g>

  <!-- ───────────── Users ───────────── -->
  <g filter="url(#shadow)">
    <rect x="48" y="214" width="190" height="76" rx="12" fill="#ffffff" stroke="#c0c9c1"/>
    <rect x="48" y="314" width="190" height="76" rx="12" fill="#ffffff" stroke="#c0c9c1"/>
  </g>
  <text x="68" y="246" font-size="16" font-weight="700" fill="#1b1c19">Patrons</text>
  <text x="68" y="268" font-size="13" fill="#414943">Students · faculty</text>
  <text x="68" y="346" font-size="16" font-weight="700" fill="#1b1c19">Librarians</text>
  <text x="68" y="368" font-size="13" fill="#414943">Cataloging · desk</text>

  <!-- ───────────── Platform panel ───────────── -->
  <rect x="280" y="156" width="680" height="500" rx="16" fill="#ffffff" stroke="#c0c9c1"/>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="304" y="205" width="170" height="110" rx="12" fill="#c3e9d0" stroke="#446652"/>
  </g>
  <text x="324" y="240" font-size="18" font-weight="700" fill="#16452f">Frontend</text>
  <text x="324" y="264" font-size="13" fill="#2c4d3c">Next.js 16 · React 19</text>
  <text x="324" y="288" font-size="12" fill="#486a56">Patron &amp; librarian UI</text>

  <!-- Backend -->
  <rect x="560" y="176" width="376" height="330" rx="14" fill="#f5f3ee" stroke="#2f5d45" stroke-width="1.5"/>
  <text x="580" y="204" font-size="16" font-weight="700" fill="#16452f">Backend API</text>
  <text x="916" y="204" font-size="12" fill="#446652" text-anchor="end">Spring Boot 4 · Java 25</text>

  <!-- Layer: security -->
  <rect x="580" y="220" width="336" height="44" rx="8" fill="#16452f"/>
  <text x="598" y="247" font-size="14" font-weight="700" fill="#ffffff">Security</text>
  <text x="898" y="247" font-size="12" fill="#a2d4b6" text-anchor="end">bearer token → session</text>

  <!-- Layer: controllers -->
  <rect x="580" y="272" width="336" height="44" rx="8" fill="#2f5d45"/>
  <text x="598" y="299" font-size="14" font-weight="700" fill="#ffffff">REST controllers</text>
  <text x="898" y="299" font-size="12" fill="#a2d4b6" text-anchor="end">/api/v1/*</text>

  <!-- Layer: services -->
  <rect x="580" y="324" width="336" height="112" rx="8" fill="#ffffff" stroke="#2f5d45"/>
  <text x="598" y="348" font-size="14" font-weight="700" fill="#16452f">Services</text>
  <g font-size="12" fill="#002112" text-anchor="middle">
    <rect x="596" y="362" width="96" height="26" rx="13" fill="#c6ebd3"/><text x="644" y="379">Auth</text>
    <rect x="700" y="362" width="96" height="26" rx="13" fill="#c6ebd3"/><text x="748" y="379">Catalog</text>
    <rect x="804" y="362" width="96" height="26" rx="13" fill="#c6ebd3"/><text x="852" y="379">Circulation</text>
    <rect x="596" y="396" width="96" height="26" rx="13" fill="#c6ebd3"/><text x="644" y="413">Lists</text>
    <rect x="700" y="396" width="96" height="26" rx="13" fill="#c6ebd3"/><text x="748" y="413">Fines</text>
    <rect x="804" y="396" width="96" height="26" rx="13" fill="#c6ebd3"/><text x="852" y="413">Cataloging</text>
  </g>

  <!-- Layer: metadata clients -->
  <rect x="580" y="444" width="336" height="44" rx="8" fill="#dbe5df" stroke="#bfc9c3"/>
  <text x="598" y="471" font-size="14" font-weight="700" fill="#151d1a">Metadata clients</text>
  <text x="898" y="471" font-size="12" fill="#3f4945" text-anchor="end">timeouts · rate limit · retry</text>

  <!-- Database -->
  <g filter="url(#shadow)">
    <path d="M650,550 v66 a98,14 0 0 0 196,0 v-66" fill="#f0eee9" stroke="#2f5d45"/>
    <ellipse cx="748" cy="550" rx="98" ry="14" fill="#e4e2dd" stroke="#2f5d45"/>
  </g>
  <text x="748" y="592" font-size="16" font-weight="700" fill="#16452f" text-anchor="middle">PostgreSQL</text>
  <text x="748" y="612" font-size="12" fill="#414943" text-anchor="middle">users · sessions · books · loans</text>

  <!-- ───────────── External services ───────────── -->
  <!-- Planned group -->
  <rect x="990" y="156" width="250" height="248" rx="14" fill="none" stroke="#c0c9c1" stroke-dasharray="6 5"/>
  <rect x="1004" y="146" width="66" height="20" rx="10" fill="#fbf9f4" stroke="#c0c9c1"/>
  <text x="1037" y="160" font-size="11" font-weight="700" fill="#717972" text-anchor="middle">PLANNED</text>

  <g fill="#ffffff" stroke="#c0c9c1" stroke-dasharray="5 4">
    <rect x="1006" y="178" width="218" height="46" rx="10"/>
    <rect x="1006" y="232" width="218" height="46" rx="10"/>
    <rect x="1006" y="286" width="218" height="46" rx="10"/>
    <rect x="1006" y="340" width="218" height="46" rx="10"/>
  </g>
  <g font-size="14" font-weight="700" fill="#363f3b">
    <text x="1022" y="198">Campus IdP</text>
    <text x="1022" y="252">Payments</text>
    <text x="1022" y="306">Email</text>
    <text x="1022" y="360">Library proxy</text>
  </g>
  <g font-size="12" fill="#717972">
    <text x="1022" y="215">SAML / OIDC sign-in</text>
    <text x="1022" y="269">Online fine payments</text>
    <text x="1022" y="323">Notifications</text>
    <text x="1022" y="377">E-resource access</text>
  </g>

  <!-- Metadata providers -->
  <g filter="url(#shadow)">
    <rect x="990" y="424" width="250" height="84" rx="12" fill="#ffffff" stroke="#2f5d45"/>
  </g>
  <text x="1008" y="452" font-size="14" font-weight="700" fill="#16452f">Metadata providers</text>
  <text x="1008" y="472" font-size="12" fill="#414943">Open Library · Google Books</text>
  <text x="1008" y="490" font-size="12" fill="#414943">Hardcover · Comic Vine · RanobeDB</text>

  <!-- ───────────── Arrows ───────────── -->
  <g fill="none" stroke="#2f5d45" stroke-width="1.6" marker-end="url(#arrow)">
    <!-- users → frontend -->
    <path d="M238,252 C270,252 272,240 302,240"/>
    <path d="M238,352 C276,352 270,282 302,282"/>
    <!-- frontend → backend -->
    <path d="M474,242 L578,242"/>
    <!-- backend → database -->
    <path d="M748,506 L748,534"/>
    <!-- metadata clients → providers -->
    <path d="M916,466 L988,466"/>
  </g>
  <!-- services → planned -->
  <path d="M936,300 L988,300" fill="none" stroke="#717972" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>

  <!-- Arrow labels -->
  <g font-size="11" fill="#446652" text-anchor="middle">
    <text x="526" y="228">REST · JSON</text>
    <text x="526" y="262">Bearer token</text>
    <text x="772" y="526" text-anchor="start">JPA</text>
    <text x="952" y="458">lookups</text>
  </g>

  <!-- ───────────── Legend ───────────── -->
  <g font-size="12" fill="#414943">
    <line x1="48" y1="686" x2="84" y2="686" stroke="#2f5d45" stroke-width="1.6"/>
    <text x="94" y="690">Built or in progress</text>
    <line x1="240" y1="686" x2="276" y2="686" stroke="#717972" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="286" y="690">Planned</text>
  </g>
</svg>
