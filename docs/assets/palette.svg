<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>OpenShelves colour palette</title>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="1279" height="459" rx="16" fill="#f3f1ec" stroke="#e5e0d8"/>
  <text x="48" y="58" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#2f5d45">Scholastic Paper · Colour</text>
  <text x="48" y="84" font-size="14" fill="#5c6460">Warm paper, forest ink, hairline rules. Token names match frontend/src/app/globals.css.</text>

  <!-- Group headers -->
  <g font-size="11" font-weight="700" letter-spacing="1.6" fill="#5c6460">
    <text x="48" y="132">SURFACES &amp; TEXT</text>
    <text x="560" y="132">BRAND</text>
    <text x="912" y="132">STATUS</text>
  </g>

  <!-- ───── Surfaces & text ───── -->
  <g>
    <rect x="48" y="148" width="148" height="96" rx="12" fill="#f3f1ec" stroke="#d8d2c7"/>
    <rect x="212" y="148" width="148" height="96" rx="12" fill="#ffffff" stroke="#d8d2c7"/>
    <rect x="376" y="148" width="148" height="96" rx="12" fill="#e5e0d8"/>
    <rect x="48" y="300" width="148" height="96" rx="12" fill="#d8d2c7"/>
    <rect x="212" y="300" width="148" height="96" rx="12" fill="#1e2320"/>
    <rect x="376" y="300" width="148" height="96" rx="12" fill="#5c6460"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1e2320">
    <text x="48" y="266">background</text>
    <text x="212" y="266">card</text>
    <text x="376" y="266">border</text>
    <text x="48" y="418">border-strong</text>
    <text x="212" y="418">foreground</text>
    <text x="376" y="418">muted-foreground</text>
  </g>
  <g font-size="12" fill="#5c6460">
    <text x="48" y="284">#F3F1EC · page</text>
    <text x="212" y="284">#FFFFFF · cards</text>
    <text x="376" y="284">#E5E0D8 · hairlines</text>
    <text x="48" y="436">#D8D2C7 · inputs, hover</text>
    <text x="212" y="436">#1E2320 · text</text>
    <text x="376" y="436">#5C6460 · metadata</text>
  </g>

  <!-- ───── Brand ───── -->
  <g>
    <rect x="560" y="148" width="148" height="96" rx="12" fill="#2f5d45"/>
    <rect x="724" y="148" width="148" height="96" rx="12" fill="#1e3f2e"/>
    <rect x="560" y="300" width="148" height="96" rx="12" fill="#e4eee8"/>
  </g>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="634" y="204" fill="#ffffff">Aa</text>
    <text x="798" y="204" fill="#ffffff">Aa</text>
    <text x="634" y="356" fill="#2f5d45">Aa</text>
  </g>
  <g font-size="13" font-weight="700" fill="#1e2320">
    <text x="560" y="266">primary · ring</text>
    <text x="724" y="266">primary-hover</text>
    <text x="560" y="418">accent</text>
  </g>
  <g font-size="12" fill="#5c6460">
    <text x="560" y="284">#2F5D45 · actions, focus</text>
    <text x="724" y="284">#1E3F2E · hover, pressed</text>
    <text x="560" y="436">#E4EEE8 · selected, available</text>
  </g>

  <!-- ───── Status (pairs) ───── -->
  <g>
    <rect x="912" y="148" width="320" height="64" rx="12" fill="#e4eee8"/>
    <rect x="912" y="228" width="320" height="64" rx="12" fill="#fdf4e7"/>
    <rect x="912" y="308" width="320" height="64" rx="12" fill="#fbeae8"/>
    <circle cx="940" cy="180" r="6" fill="#2f5d45"/>
    <circle cx="940" cy="260" r="6" fill="#c27d23"/>
    <circle cx="940" cy="340" r="6" fill="#b83a30"/>
  </g>
  <g font-size="14" font-weight="700">
    <text x="958" y="176" fill="#2f5d45">Available</text>
    <text x="958" y="256" fill="#c27d23">Due soon</text>
    <text x="958" y="336" fill="#b83a30">Overdue</text>
  </g>
  <g font-size="12" fill="#5c6460">
    <text x="958" y="196">primary on accent · #2F5D45 / #E4EEE8</text>
    <text x="958" y="276">warning on warning-subtle · #C27D23 / #FDF4E7</text>
    <text x="958" y="356">destructive on destructive-subtle · #B83A30 / #FBEAE8</text>
  </g>
</svg>
